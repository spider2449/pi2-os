# SD card layout (MBR; the Pi 2 boot ROM does not read GPT).
#   p1 boot   FAT32     128 MiB  firmware, kernel, pios.toml, docker-tls/
#   p2 rootA  squashfs  256 MiB  active root filesystem (read-only)
#   p3 rootB  -         256 MiB  reserved for A/B updates
#   p4 data   ext4      64 MiB   grown to fill the card on first boot

image pios.img {
	hdimage {
		partition-table-type = "mbr"
		# Non-zero signature: Windows treats 0 as an uninitialised disk and
		# will not mount the boot partition. 0x50694f53 = "PiOS".
		disk-signature = 0x50694f53
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		offset = 4M
		image = "boot.vfat"
		size = 128M
	}

	partition rootA {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootB {
		partition-type = 0x83
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
		size = 64M
	}
}
